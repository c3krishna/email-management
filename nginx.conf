# /etc/nginx/sites-available/email-management.worktual.tech
# Place in: /etc/nginx/sites-available/email-management
# Enable: ln -s /etc/nginx/sites-available/email-management /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name email-management.worktual.tech;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name email-management.worktual.tech;

    # SSL — from Let's Encrypt or your existing cert
    # certbot --nginx -d email-management.worktual.tech
    ssl_certificate     /etc/letsencrypt/live/email-management.worktual.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/email-management.worktual.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Restrict access — internal network only
    # Uncomment and adjust to your office/VPN IP ranges:
    # allow 10.180.0.0/16;
    # allow 82.113.92.0/24;
    # deny all;

    # Live AI analyze can take longer (Ollama) — raise before generic /api/
    location /api/orchestration/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 15s;
    }

    # API (Node.js backend on port 5200)
    location /api/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # React frontend (built static files)
    root /var/www/email-management/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/email-management.access.log;
    error_log  /var/log/nginx/email-management.error.log;
}
